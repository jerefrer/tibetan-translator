<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tibetan Lookup</title>
    <link rel="icon" type="image/png" href="/img/logo.png" />
    <style>
      /* Prevent white flash on load */
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
      /* The window's surface (tokens.css), before the styles load */
      html {
        background-color: #FFFDF8;
      }
      html[data-theme='dark'] {
        background-color: #2A211D;
      }
    </style>
    <script>
      // Resolve the theme before the app loads so a dark window never
      // flashes light (src/services/theme.js applies it properly after).
      try {
        var preference = JSON.parse(localStorage['tibetan-translator.themePreference'] || '"light"');
        var dark = preference === 'dark' ||
          (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="popup"></div>
    <script type="module" src="/src/popup.js"></script>
  </body>
</html>
