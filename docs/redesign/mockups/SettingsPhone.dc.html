<html lang="en">
<head>

</head>
<body>
<x-dc>
<helmet>

<style>
@font-face{font-family:'DDC_Uchen';src:url(/_blob/f5823bcabc5271bfb889c5add594853f) format('woff');font-display:swap}

</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; {{vars}}"><div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Settings</span><div style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(42, 31, 26, 0.05); overflow: hidden"><div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 0"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 500">My glossary</span><span style="font-size: 13px; color: var(--muted)">3 entries</span></div><span style="color: var(--faint)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 1px solid var(--soft)"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 500">Dictionaries</span><span style="font-size: 13px; color: var(--muted)">35 installed · 1 of 3 packs</span></div><span style="color: var(--faint)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></div></div><div style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(42, 31, 26, 0.05); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px"><span style="font-size: 15.5px; font-weight: 500">Appearance</span><div style="display: flex; gap: 8px"><button type="button" style="height: 38px; border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500">System</button><button type="button" style="height: 38px; border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer; border: 0; background: var(--accent); color: var(--on-accent); font-weight: 600">Light</button><button type="button" style="height: 38px; border-radius: 10px; padding: 0 16px; font-size: 14px; cursor: pointer; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font-weight: 500">Dark</button></div><div style="display: flex; align-items: center; gap: 12px"><span style="font-size: 13px; color: var(--muted)">Text size</span><div style="flex: 1; position: relative; height: 4px; border-radius: 4px; background: var(--line-strong)"><div style="position: absolute; left: 0; width: 33%; height: 4px; border-radius: 4px; background: var(--accent)"></div><div style="position: absolute; left: 33%; top: -7px; width: 18px; height: 18px; border-radius: 50%; background: var(--accent)"></div></div><span style="font-size: 13px; color: var(--muted)">100%</span></div></div><div style="background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(42, 31, 26, 0.05); overflow: hidden"><div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 0"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 500">Dictionary preferences</span><span style="font-size: 13px; color: var(--muted)">Reorder and switch off dictionaries</span></div><span style="color: var(--faint)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></div><div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 8px 16px; border-top: 1px solid var(--soft)"><div style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15.5px; font-weight: 500">What’s new</span><span style="font-size: 13px; color: var(--muted)">Tibetan Translator 1.12.0</span></div><span style="color: var(--faint)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></span></div></div></div>
<nav aria-label="Main" style="flex: none; height: 76px; box-sizing: border-box; background: var(--rail-bg); border-top: 1px solid var(--rail-line); display: flex; padding: 6px 8px 14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-current="page" style="flex: 1; border: 0; border-radius: 12px; background: var(--rail-active-bg); color: var(--rail-active-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
<sc-if value="{{n.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex: 1; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
</sc-for>
</nav>
</div>

{ label: 'Settings', path: 'M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zM12 3v3M12 18v3M3 12h3M18 12h3', active: true, idle: false }

};
}
}
</script>
