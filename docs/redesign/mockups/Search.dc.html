<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
@font-face{font-family:'DDC_Uchen';src:url(/_blob/f5823bcabc5271bfb889c5add594853f) format('woff');font-display:swap}
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: flex; overflow: hidden; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; {{vars}}">
<nav aria-label="Main" style="width: 88px; flex: none; box-sizing: border-box; background: var(--rail-bg); border-right: 1px solid var(--rail-line); display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 6px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: var(--logo-bg); color: var(--logo-ink); display: flex; align-items: center; justify-content: center; margin-bottom: 22px"><span style="font-family: 'DDC_Uchen', serif; font-size: 30px; line-height: 1; margin-top: 6px">ཀ</span></div>
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-current="page" style="width: 68px; height: 62px; border: 0; border-radius: 12px; background: var(--rail-active-bg); color: var(--rail-active-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 600; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
<sc-if value="{{n.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" style="width: 68px; height: 62px; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 500; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
</sc-for>
<div style="width: 36px; height: 1px; background: var(--rail-line); margin: 10px 0 8px"></div>
<button type="button" style="width: 68px; height: 62px; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18H6zM9 3v18M12 8h3M12 12h3"/></svg>My glossary</button>
<button type="button" style="width: 68px; height: 62px; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4v16H5zM11 4h4v16h-4zM17.5 5l3 .8-3.6 14.4-3-.8z"/></svg>Dictionaries</button>
<div style="flex: 1"></div>
<button type="button" style="width: 68px; height: 62px; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>Settings</button>
</nav>
<main style="flex: 1; min-width: 0; box-sizing: border-box; padding: 28px 40px 0; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 16px">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search query</label>
<div style="flex: 1; max-width: 880px; height: 60px; box-sizing: border-box; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 4px var(--ring); display: flex; align-items: center; gap: 12px; padding: 0 8px 0 18px">
<input id="q" type="text" value="wakefulness" readonly style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; font-family: 'Source Serif 4', Georgia, serif; font-size: 22px; color: var(--ink)">
<button type="button" aria-label="Search" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
</button>
</div>
<button type="button" style="border: 0; background: none; color: var(--accent); font-size: 13.5px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 8px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
Query builder
</button>
</div>

<div style="display: flex; align-items: center; gap: 14px">
<span style="font-size: 14px; color: var(--muted)">Showing <b style="color: var(--ink); font-weight: 600">12</b> of <b style="color: var(--ink); font-weight: 600">147</b> results</span>
<div style="flex: 1"></div>
<button type="button" style="height: 36px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 13.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">Dictionaries · 35
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<button type="button" style="height: 36px; border: 1.5px solid var(--line-strong); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 13.5px; font-weight: 500; cursor: pointer">Add my definition</button>
</div>

<div style="position: relative; flex: 1; min-height: 0; overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(42, 31, 26, 0.05)">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<article style="display: grid; grid-template-columns: 300px 150px minmax(0, 1fr); gap: 20px; align-items: baseline; padding: 14px 24px; border-bottom: 1px solid var(--soft)">
<span style="font-family: 'DDC_Uchen', serif; font-size: 24px; line-height: 1.7; color: var(--rubric)">{{r.term}}</span>
<span style="justify-self: start; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 9px">Rangjung Yeshe</span>
<p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 17.5px; line-height: 1.5">{{r.text}}</p>
</article>
</sc-for>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; background: linear-gradient(to bottom, rgba(255,253,248,0), var(--surface))"></div>
</div>

<div style="margin-bottom: 24px; border: 1.5px dashed var(--amber-line); background: var(--amber-bg); border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 16px">
<span style="flex: 1; font-size: 14px; color: var(--amber-ink)"><b style="font-weight: 600">Searching 35 of 65 dictionaries.</b> Two optional packs are not installed, so their entries are not in these results.</span>
<button type="button" style="height: 36px; border: 0; border-radius: 10px; background: var(--amber-ink); color: var(--on-dark); padding: 0 16px; font-size: 13.5px; font-weight: 600; cursor: pointer">See packs</button>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const palette = {
'bg': '#FAF3E0', 'surface': '#FFFDF8', 'ink': '#2A1F1A', 'muted': '#6A5B50', 'faint': '#9C8D7E',
'line': '#E6D9BC', 'line-strong': '#D6C59F', 'soft': '#F0E6CE',
'accent': '#A30000', 'accent-soft': '#F7E3DD', 'accent-line': '#E7BDB4', 'on-accent': '#FFFFFF',
'rubric': '#A30000', 'ring': '#F7E3DD',
'amber-bg': '#FFF0BF', 'amber-ink': '#4A3600', 'amber-line': '#A87400',
'dark': '#2A1F1A', 'on-dark': '#FFF8E8',
'rail-bg': '#A30000', 'rail-line': '#7C0000', 'rail-ink': '#F9DAD4',
'rail-active-bg': '#7C0000', 'rail-active-ink': '#FFC107',
'logo-bg': '#FFC107', 'logo-ink': '#7C0000'
};

return {
vars: Object.keys(palette).map((key) => '--' + key + ': ' + palette[key]).join('; '),
nav: [
{ label: 'Define', path: 'M5 4.5h6.5a2 2 0 0 1 2 2V20a2 2 0 0 0-2-2H5zM19 4.5h-6.5a2 2 0 0 0-2 2V20a2 2 0 0 1 2-2H19z', active: false, idle: true },
{ label: 'Search', path: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-3.5-3.5', active: true, idle: false },
{ label: 'Split', path: 'M4 8h5M15 8h5M4 16h5M15 16h5M12 4v16', active: false, idle: true }
],
rows: [
{ term: 'བདེ་སྟོང་གི་ཡེ་ཤེས་', text: 'empty and blissful wakefulness; a bliss-void wisdom' },
{ term: 'བདེ་སྟོང་ཡེ་ཤེས་', text: 'wisdom of empty bliss / blissful emptiness; primordial wakefulness that is blissful yet empty' },
{ term: 'བསྒོམས་བྱུང་ཡེ་ཤེས་', text: 'wisdom / original wakefulness resulting from meditation training' },
{ term: 'ཆོས་ལ་བདག་མེད་པའི་ཡེ་ཤེས་རྣམ་པར་མི་རྟོག་པ་', text: 'thoughtfree wakefulness [that sees] the absence of self-entity in things' },
{ term: 'ཆོས་ཉིད་རྣམ་དག་གི་ཡེ་ཤེས་', text: 'innate pure wakefulness' },
{ term: 'ཆོས་སྐུ་རང་བྱུང་གི་ཡེ་ཤེས་', text: 'self-existing wakefulness of dharmakaya' },
{ term: 'བཟོ་མེད་', text: 'Nonfabrication. The key point in the training of Mahamudra and Dzogchen; that innate wakefulness is not created …' },
{ term: 'ཆོས་ཉིད་འོད་གསལ་', text: 'Luminous dharmata. The innate wakefulness that is the nature of mind of all sentient beings' },
{ term: 'ད་ལྟའི་ཤེས་པ་', text: 'present wakefulness / awareness, mind of nowness, present mind' },
{ term: 'དབྱིངས་དང་ཡེ་ཤེས་', text: 'space and wakefulness' },
{ term: 'དོན་དམ་པའི་ཡེ་ཤེས་ཀྱི་ཆེ་བ་ཉིད་', text: 'the greatness of ultimate wakefulness' },
{ term: 'དྲན་རིག་', text: 'awakeness, wakefulness, cognizance' }
]
};
}
}
</script>
</body>
</html>
