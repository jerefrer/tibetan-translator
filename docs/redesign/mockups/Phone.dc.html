<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lookup on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
@font-face{font-family:'DDC_Uchen';src:url(/_blob/f5823bcabc5271bfb889c5add594853f) format('woff');font-display:swap}
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: var(--bg); color: var(--ink); font-family: 'Instrument Sans', 'Helvetica Neue', Arial, sans-serif; font-size: 14px; {{vars}}">

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">

<!-- Field -->
<div>
<label for="lookup" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Look up a word</label>
<div style="height: 54px; box-sizing: border-box; background: var(--surface); border: 1.5px solid var(--accent); border-radius: 14px; box-shadow: 0 0 0 4px var(--ring); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 14px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
<input id="lookup" type="text" value="ཡེ་ཤེས་" readonly style="flex: 1; min-width: 0; height: 100%; box-sizing: border-box; border: 0; outline: 0; background: transparent; font-family: 'DDC_Uchen', serif; font-size: 24px; line-height: 1.5; color: var(--ink); padding: 8px 0 0">
<button type="button" aria-label="Change the detected language" style="height: 34px; border: 1px solid var(--accent-line); background: var(--accent-soft); color: var(--accent); border-radius: 9px; padding: 0 10px; display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600">
Wylie
<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
</button>
</div>
</div>

<!-- Headword -->
<section style="display: flex; flex-direction: column; gap: 0">
<span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted)">Tibetan · 29 entries, 17 searched</span>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 8px">
<h1 style="margin: 0; font-family: 'DDC_Uchen', serif; font-weight: 400; font-size: 46px; line-height: 1.55; color: var(--rubric)">ཡེ་ཤེས་</h1>
<button type="button" aria-label="Play the pronunciation" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--surface); color: var(--accent); display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
</button>
</div>
<span style="font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; color: var(--muted)">ye shes · yeshé</span>
</section>

<!-- Glance -->
<div style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
<sc-for list="{{glance}}" as="g" hint-placeholder-count="5">
<span style="flex: none; display: inline-flex; align-items: center; gap: 8px; height: 32px; box-sizing: border-box; padding: 0 6px 0 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-family: 'Source Serif 4', Georgia, serif; font-size: 15.5px">
{{g.word}}
<span style="min-width: 20px; height: 20px; box-sizing: border-box; padding: 0 6px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-family: 'Instrument Sans', Arial, sans-serif; font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center">{{g.count}}</span>
</span>
</sc-for>
</div>

<!-- Filters -->
<div role="tablist" aria-label="Kind of dictionary" style="display: flex; gap: 8px; overflow: hidden; margin-right: -16px">
<button type="button" role="tab" aria-selected="true" style="flex: none; height: 40px; border: 0; border-radius: 10px; background: var(--dark); color: var(--on-dark); padding: 0 14px; font-size: 13.5px; font-weight: 600">All · 17</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 13.5px; font-weight: 500">Translations · 9</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 13.5px; font-weight: 500">Definitions · 5</button>
<button type="button" role="tab" aria-selected="false" style="flex: none; height: 40px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 0 14px; font-size: 13.5px; font-weight: 500">Sanskrit · 3</button>
</div>

<!-- Entries -->
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{entries}}" as="e" hint-placeholder-count="3">
<article style="background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 9px">{{e.dictionary}}</span>
<span style="font-size: 12px; color: var(--muted)">{{e.kind}}</span>
</div>
<p style="margin: 0; font-family: 'Source Serif 4', Georgia, serif; font-size: 17px; line-height: 1.5">{{e.text}}</p>
</article>
</sc-for>
</div>
</div>

<!-- Packs not searched -->
<div style="position: absolute; left: 12px; right: 12px; bottom: 88px; background: var(--amber-bg); border: 1.5px dashed var(--amber-line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: 0 6px 20px rgba(26, 30, 43, 0.12)">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 600; color: var(--amber-ink)">12 more entries not searched</span>
<span style="font-size: 12.5px; color: var(--amber-ink)">Two packs are not installed.</span>
</div>
<button type="button" style="flex: none; height: 44px; border: 0; border-radius: 10px; background: var(--amber-ink); color: var(--on-dark); padding: 0 14px; font-size: 13.5px; font-weight: 600">See packs</button>
</div>

<!-- Bottom navigation -->
<nav aria-label="Main" style="flex: none; height: 76px; box-sizing: border-box; background: var(--rail-bg); border-top: 1px solid var(--rail-line); display: flex; padding: 6px 8px 14px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<sc-if value="{{n.active}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-current="page" style="flex: 1; border: 0; border-radius: 12px; background: var(--rail-active-bg); color: var(--rail-active-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 600">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
<sc-if value="{{n.idle}}" hint-placeholder-val="{{ true }}">
<button type="button" style="flex: 1; border: 0; border-radius: 12px; background: transparent; color: var(--rail-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11.5px; font-weight: 500">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{n.path}}"/></svg>
{{n.label}}
</button>
</sc-if>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const palettes = {
heritage: {
'bg': '#FAF3E0', 'surface': '#FFFDF8', 'ink': '#2A1F1A', 'muted': '#6A5B50',
'line': '#E6D9BC', 'line-strong': '#D6C59F', 'soft': '#F0E6CE',
'accent': '#A30000', 'accent-soft': '#F7E3DD', 'accent-line': '#E7BDB4', 'on-accent': '#FFFFFF',
'rubric': '#A30000', 'ring': '#F7E3DD',
'amber-bg': '#FFF0BF', 'amber-ink': '#4A3600', 'amber-line': '#A87400', 'amber-solid': '#8F6200',
'ok': '#2E7D32', 'dark': '#2A1F1A', 'on-dark': '#FFF8E8',
'rail-bg': '#A30000', 'rail-line': '#7C0000', 'rail-ink': '#F9DAD4',
'rail-active-bg': '#7C0000', 'rail-active-ink': '#FFC107',
'logo-bg': '#FFC107', 'logo-ink': '#7C0000'
}
};
const palette = palettes.heritage;
return {
vars: Object.keys(palette).map((key) => '--' + key + ': ' + palette[key]).join('; '),
nav: [
{ label: 'Lookup', path: 'M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-3.5-3.5', active: true, idle: false },
{ label: 'Reading', path: 'M4 5h16M4 10h10M4 15h16M4 20h8', active: false, idle: true },
{ label: 'Library', path: 'M5 4h4v16H5zM11 4h4v16h-4zM17.5 5l3 .8-3.6 14.4-3-.8z', active: false, idle: true },
{ label: 'Collection', path: 'M6 4h12v17l-6-4-6 4z', active: false, idle: true }
],
glance: [
{ word: 'wisdom', count: 5 },
{ word: 'awareness', count: 3 },
{ word: 'wakefulness', count: 3 },
{ word: 'gnosis', count: 2 },
{ word: 'knowledge', count: 2 }
],
entries: [
{ dictionary: 'Hopkins 2015', kind: 'Translation', text: 'pristine wisdom; exalted wisdom; wisdom' },
{ dictionary: 'Rangjung Yeshe', kind: 'Translation', text: 'knowledge, original wakefulness, gnosis, cognition, wisdom, primal awareness, pristine awareness, …' },
{ dictionary: '84000 Glossary', kind: 'Translation', text: 'awareness, gnosis, knowledge, primordial wisdom, transcendental knowledge, wakefulness, wisdom' }
]
};
}
}
</script>
</body>
</html>
